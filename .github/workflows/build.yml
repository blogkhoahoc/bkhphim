name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write   # cần để tạo Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK (debug-signed, cài trực tiếp được)
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BKHPhim-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Đính kèm APK vào Release (lưu vĩnh viễn)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BKHPhim APK ${{ github.run_number }}
          body: |
            File APK cài trực tiếp cho điện thoại và Android TV.
            Tải file app-debug.apk bên dưới.
          files: app/build/outputs/apk/debug/*.apk
